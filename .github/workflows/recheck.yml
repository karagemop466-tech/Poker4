name: daily-recheck

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Re-check official sources (hash + diff)
        run: python3 tools/recheck.py

      - name: Capture room live schedules (snapshot + diff)
        run: python3 tools/daily_schedule.py

      - name: Verify site integrity
        run: python3 tools/verify_root_site.py

      - name: Commit monitor output
        run: |
          git config user.name "poker4-recheck-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/v2/monitor
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore(recheck): daily source monitor run $(date -u +%F)"
            git push
          fi
