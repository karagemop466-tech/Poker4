name: Daily official poker-room schedule feed

# Morning fetch of official room/schedule endpoints. The primary source-change
# audit + canonical page rebuild is url-check.yml; this workflow is the separate
# daily multi-room feed lane and must not run a second root-page generator.

on:
  schedule:
    - cron: "17 14 * * *"  # 14:17 UTC ≈ 06:17–07:17 Las Vegas daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-schedule-feed
  cancel-in-progress: false

jobs:
  daily-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch official daily schedules for listed Strip rooms
        run: python3 scripts/fetch_daily_schedules.py

      - name: Commit dated feed snapshots
        run: |
          git config user.name "poker4-schedule-feed"
          git config user.email "actions@users.noreply.github.com"
          git add data/integrated/monitoring/fetches
          git add data/integrated/monitoring/daily-schedule-report.json
          if git diff --cached --quiet; then
            echo "No feed changes."
          else
            git commit -m "chore(schedule-feed): daily official room snapshots $(date -u +%F)"
            git pull --rebase origin main
            git push origin main
          fi
