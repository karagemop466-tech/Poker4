name: Monitor official sources

on:
  schedule:
    # Daily at 07:00 UTC — pulls each Strip room's official schedule each morning
    # and re-checks every official source URL for changes.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # the token has to stay in the remote URL: this job pushes the refreshed
          # last-checked dates back to main (persist-credentials: false made every
          # push fail with "could not read Username", which is why this job was red)
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Re-check every official source URL
        run: python3 tools/check_sources.py

      - name: Pull each Strip room's official daily schedule
        run: python3 tools/scrape_schedule.py
        continue-on-error: true

      - name: Commit updated monitoring state if changed
        run: |
          git config user.name "Poker4 Monitor"
          git config user.email "monitor@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add -A planner/assets/data.js planner/data planner/assets/snapshots.json
          if git diff --cached --quiet; then
            echo "No changes to monitoring state."
          else
            git commit -m "chore(monitor): refresh official-source last-checked dates and change log"
            git push origin main || { git pull --rebase --autostash origin main && git push origin main; }
          fi
