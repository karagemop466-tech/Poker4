name: Official source sync + change monitor

# Each morning (06:00 Las Vegas time, Pacific) re-read every official URL the
# dashboard cites, re-audit every structure sheet, and commit the results so the
# published tables can stamp "last checked" and mark rows whose source changed.

on:
  schedule:
    - cron: '0 14 * * *' # 14:00 UTC = 06:00 America/Los_Angeles (PST; 07:00 PDT)
  push:
    branches: [main, 'arena/a3838778-poker4']
    paths:
      - data/tracked-sources.json
      - data/poker4.json
      - tools/sync_official_sources.py
      - scripts/integrate_data.py
      - scripts/verify_root.py
      - .github/workflows/url-check.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PDF text extraction fallback
        run: python -m pip install --quiet pypdf

      - name: Re-check official sources and audit structure sheets
        run: python tools/sync_official_sources.py

      - name: Refresh provenance hashes for the captured official sources
        # room-facts.json records the SHA-256 of each data/raw capture; the sync rewrites those
        # captures (capture header timestamps), so the hashes must be regenerated in the same run.
        run: python tools/room_extract.py

      - name: Refresh the value-level audit for the new snapshot
        # data/audit-values.json is keyed to the snapshot id (byte-stable per snapshot). Any
        # sync that advances the snapshot must regenerate it in the same commit, or the
        # "the audit result on the page must match the audit run" step of
        # "Verify the published site" fails on the next push (this is what left main red
        # after the 2026-11-19T06:02Z sync; repaired in the 1257a37f integration round).
        run: python scripts/audit_values.py --strict

      - name: Rebuild the dashboard pages from the refreshed snapshots
        run: python scripts/integrate_data.py

      - name: Verify the site before publishing it
        run: |
          python scripts/verify_root.py
          python scripts/verify.py

      - name: Commit the refreshed snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # rebase first: the v2 monitor and the other session jobs push to main too, and a
          # plain push loses that race silently, which is what left "no changes to record"
          # runs behind while the site kept serving stale last-checked dates.
          git pull --rebase --autostash origin ${GITHUB_REF_NAME}
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to record."
          else
            git commit -m "chore(sources): scheduled official-source sync $(date -u +%FT%TZ)"
            git push origin HEAD:${GITHUB_REF_NAME} || { git pull --rebase --autostash origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME}; }
          fi
