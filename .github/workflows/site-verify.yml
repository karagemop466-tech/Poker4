name: Verify the published site

# A broken page must never reach GitHub Pages. Both verifiers run on every push that
# touches the site or its data, and on every pull request against main.

on:
  push:
    branches: [main, 'arena/e74e00fd-poker4']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild from the committed snapshots and check it matches
        run: |
          python scripts/integrate_data.py
          python scripts/verify_root.py
          python scripts/verify.py

      - name: Fail if the committed pages are not what the data produces
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "committed pages match data/ — nothing stale"
          else
            echo "The committed HTML does not match data/. Run: python3 scripts/integrate_data.py and commit the result."
            git diff --cached --stat
            exit 1
          fi

      - name: Check every page parses as HTML and links resolve
        run: python3 scripts/verify_markup.py

      # The link check above proves a row has a source. This proves the published
      # number or sentence actually came from that source: every figure and every
      # quoted rule sentence is looked for, word for word, in the official captures
      # and transcriptions committed in this repository. A value that cannot be
      # found fails the build — it is never quietly corrected.
      - name: Value-level audit of every published figure and quote
        run: |
          python3 scripts/audit_values.py --strict
          git diff --stat -- data/audit-values.json

      - name: The audit result on the page must match the audit run
        run: |
          python3 scripts/integrate_data.py
          git add -A data/audit-values.json
          if git diff --cached --quiet; then
            echo "the published audit result matches the audit run"
          else
            echo "the committed audit result is stale — commit the regenerated data/audit-values.json"
            git diff --cached --stat
            exit 1
          fi
      # (the audit file is byte-stable: it is keyed to the snapshot, not to the run)