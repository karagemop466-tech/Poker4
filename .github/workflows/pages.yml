name: Deploy static dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Never cancel an in-flight deploy: cancelling mid-run races the
  # actions/upload-pages-artifact -> actions/deploy-pages hand-off and the deploy
  # step fails with "No artifacts named github-pages were found" (observed on the
  # PR #82 merge, 2026-11-17, when a scheduled sync pushed into the same second).
  # Deploys are idempotent — queued runs simply deploy the newer commit after.
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
