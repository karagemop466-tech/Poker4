name: Check Vegas Field Notes sub-site

on:
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/validate_site.py'
      - '.github/workflows/site-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate data and source links
        run: python3 scripts/validate_site.py
      - name: Check JavaScript syntax
        run: node --check site/app.js
