name: Site build + verification gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rebuild the dashboard from the data files
        run: python3 tools/build_poker4.py
      - name: Confirm the build is reproducible (no uncommitted drift)
        run: |
          git add -A data/08f07d1d poker4
          git diff --cached --quiet || { echo "generated pages differ from committed pages"; git diff --cached --stat; exit 1; }
      - name: Verify every row links an official source
        run: python3 tools/verify_poker4.py
      - name: Verify the schedule table against the re-read official rows
        run: python3 tools/check_rows.py
      - name: Verify the monitor tool's parser logic
        run: python3 tools/poker4_monitor.py --selftest
