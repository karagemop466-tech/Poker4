name: v2 source monitor

# Re-checks every official URL in data/v2/sources.json, hashes the normalised text
# of each page, and opens an issue when a hash moves. It deliberately never
# rewrites a value: a human still has to read the diff and update the JSON.

on:
  schedule:
    - cron: "17 13 * * *"   # daily 13:17 UTC (05:17 Las Vegas)
  workflow_dispatch:
  push:
    paths:
      - "data/v2/sources.json"
      - "tools/v2_check_sources.py"
      - ".github/workflows/v2-monitor.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: v2-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Re-check official sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check sources
        id: check
        env:
          REPORT: data/v2/snapshots/check-${{ github.run_id }}.txt
        run: |
          mkdir -p data/v2/snapshots
          python3 tools/v2_check_sources.py \
            --state data/v2/source_state.json \
            --report "$REPORT" | tee "$GITHUB_STEP_SUMMARY"

      - name: Commit state and snapshot
        if: always()
        run: |
          git config user.name  "v2-monitor[bot]"
          git config user.email "v2-monitor@users.noreply.github.com"
          git add data/v2/source_state.json data/v2/snapshots
          if git diff --cached --quiet; then
            echo "nothing to record"
            exit 0
          fi
          git commit -m "chore(v2): source monitor run ${{ github.run_id }}"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Open an issue when something moved
        if: steps.check.outputs.changed != '0'
        uses: actions/github-script@v7
        env:
          CHANGED: ${{ steps.check.outputs.changed }}
          SUMMARY: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const n = process.env.CHANGED;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `v2: ${n} official source(s) changed`,
              body: [
                `${n} official page(s) in \`data/v2/sources.json\` produced a different hash than the last run.`,
                '',
                'This is a prompt to re-read the affected rows by hand — the monitor never edits a value.',
                '',
                `Run log and diff: ${process.env.SUMMARY}`,
                `Snapshot: \`data/v2/snapshots/check-${context.runId}.txt\``,
                '',
                'When a fact really changed: update the JSON, bump the `retrieved` date, and note the old value.',
              ].join('\n'),
              labels: ['v2-monitor']
            });
