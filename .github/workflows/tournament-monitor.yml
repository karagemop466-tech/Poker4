name: Daily schedule + source-change monitor

# Runs every morning (Las Vegas time) and on demand:
#  - re-checks every official URL used by a table row
#  - marks rows whose source content changed (byte hash, not just status code)
#  - audits each Venetian structure sheet for entry / re-entry / add-on wording
#  - scrapes the official DeepStack calendar into a machine-readable daily feed
#  - regenerates the poker4 pages and only commits when the site still verifies

# E1004114 (2026-11-18): the scheduled trigger was removed. This workflow writes to the legacy
# poker4/ and data/08f07d1d/ folders (not the published root pages) and its verify step failed on
# every cron run on main (run 44190052816). The daily monitors that publish are url-check.yml,
# source-recheck.yml and maintenance.yml. Manual dispatch is kept for reruns.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to run on and commit back to (default: the branch that triggered this run)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: tournament-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target ref
        id: ref
        run: |
          TARGET="${{ github.event.inputs.ref }}"
          if [ -z "$TARGET" ]; then TARGET="${{ github.ref_name }}"; fi
          echo "branch=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Check out ${{ steps.ref.outputs.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.branch }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install fetch/PDF dependencies
        run: python -m pip install --quiet requests pypdf

      - name: Re-check official sources and audit structure sheets
        env:
          GIT_BRANCH: ${{ steps.ref.outputs.branch }}
        run: python3 tools/poker4_monitor.py --once

      - name: Rebuild the poker4 pages from the refreshed data
        run: python3 tools/build_poker4.py

      - name: Verify the site before committing (a broken site is never committed)
        run: python3 tools/verify_poker4.py

      - name: Commit refreshed data and pages
        env:
          GIT_BRANCH: ${{ steps.ref.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/08f07d1d poker4
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore(monitor): official-source re-check $(date -u +%F) [skip ci]"
            git pull --rebase origin "$GIT_BRANCH" || true
            git push origin "HEAD:$GIT_BRANCH"
          fi

      - name: Summary
        run: |
          python3 - <<'PY'
          import json
          s = json.load(open("data/08f07d1d/monitor_state.json"))
          print("### Official-source monitor")
          print(f"- checked at: {s.get('last_checked')}")
          print(f"- sources with changed content: {', '.join(s.get('sources_changed_this_run') or []) or 'none'}")
          print(f"- unreachable official URLs: {', '.join(s.get('unreachable_this_run') or []) or 'none'}")
          tot = len(s.get("sources", {}))
          print(f"- tracked official URLs: {tot}")
          PY
