name: Feature source re-check (data/feature)

# E1004114 (2026-11-18): the scheduled trigger was removed. Its "Commit changes" step failed on every
# cron run (run 44185555543) and it writes to the legacy data/feature/ folder. The published daily
# monitors are url-check.yml, source-recheck.yml and maintenance.yml. Manual dispatch is kept.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Re-check every official source URL
        run: python3 scripts/scrape_daily.py
      - name: Rebuild site data (validation gate)
        run: python3 scripts/build_site2.py
      - name: Commit changes if any
        run: |
          git config user.name "poker4-recheck"
          git config user.email "recheck@users.noreply.github.com"
          git add -A data/feature assets/data.js
          git diff --cached --quiet || git commit -m "recheck: source change detection $(date -u +%F)"
          git push
